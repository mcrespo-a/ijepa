# Debug variant of pretrain.yaml, used by .vscode/launch.json ("IJEPA: pretrain").
# Inherits everything from pretrain.yaml and only overrides what differs.
BASE: ['pretrain.yaml']
data:
  batch_size: 4
  num_workers: 0         # keep data loading in-process so breakpoints bind
  verify_exists: false
logging:
  folder: /project/home/mcrespoa/ijepa/experiments/radimagenet-us/DEBUG/
freq_mask:
  enable: true
wandb:
  enable: false
  run_name: DEBUG
