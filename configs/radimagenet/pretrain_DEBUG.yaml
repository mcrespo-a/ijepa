  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false
logging:
  folder: /project/home/mcrespoa/ijepa/experiments/radimagenet-us/DEBUG/
  write_tag: jepa
freq_mask:
  enable: true
mask:
  allow_overlap: false
  aspect_ratio:
  - 0.75
  - 1.5
  enc_mask_scale:
  - 0.85
  - 1.0
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 2
  patch_size: 16
  pred_mask_scale:
  - 0.075 #0.15
  - 0.125 #0.2
meta:
  copy_data: false
  load_checkpoint: false
  model_name: vit_small
  pred_depth: 12
  pred_emb_dim: 384
  read_checkpoint: null #/project/home/mcrespoa/ijepa/experiments/radimagenet-us/vits16.224-bs.16-ep.300/jepa-latest.pth.tar
  use_bfloat16: true
optimization:
  ema:
  - 0.996
  - 1.0
  epochs: 300
  final_lr: 1.0e-06
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 0.001
  start_lr: 0.0002
  warmup: 40
  weight_decay: 0.04
wandb:
  root: '/project/home/mcrespoa/ijepa/experiments/radimagenet-us'
  enable: false
  mode: offline
  project: ijepa-pretrain
  entity: null
  group: radimagenet-us
  run_name: DEBUG
  run_id: null
  dir: null
