logging:
  folder: /project/home/mcrespoa/ijepa-freq/experiments/radimagenet-us/vits16.128-bs.512-ep.300
wandb:
  enable: true
  root: /project/home/mcrespoa/ijepa-freq/experiments/radimagenet-us
  group: radimagenet-us
  run_name: vits16.224-bs.128-ep.300
freq_mask:
  enable: false
mask:
  allow_overlap: false
  aspect_ratio:
  - 0.75
  - 1.5
  enc_mask_scale:
  - 0.85
  - 1.0
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 16
  pred_mask_scale:
  - 0.075 #0.15
  - 0.125 #
optimization:
  epochs: 300
  save_every: 20
  ema: [0.999, 1.0]